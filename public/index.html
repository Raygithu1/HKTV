<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1115">
    <title>Hong Kong OTA TV Guide</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark">HK</span>
        <div>
          <h1>Hong Kong TV Guide</h1>
          <p class="subtitle">TVB OTA channels &middot; Hong Kong Time</p>
        </div>
      </div>
      <div class="clock">
        <div id="clock-time" class="clock-time">--:--</div>
        <div id="clock-date" class="clock-date">Loading&hellip;</div>
      </div>
    </header>

    <nav id="day-nav" class="day-nav" aria-label="Day"></nav>

    <div class="slider-bar">
      <input id="time-slider" class="time-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Scroll timeline">
    </div>

    <div id="legend" class="legend"></div>

    <main>
      <div id="status" class="status">Loading guide&hellip;</div>
      <div id="guide" class="guide" hidden></div>
    </main>

    <footer class="site-footer">
      <span id="generated">&nbsp;</span>
      <span id="source"></span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
